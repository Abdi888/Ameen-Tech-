name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    # Same local defaults as docker-compose.yml. Not production secrets.
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: test-only-not-for-production
      DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://ameen:ameen@localhost:5432/ameen_retail
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ameen
          POSTGRES_PASSWORD: ameen
          POSTGRES_DB: ameen_retail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ameen -d ameen_retail"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check "uv==0.13.0"
          python -m uv lock --check
          python -m uv sync --frozen --extra dev

      - name: Lint
        run: python -m uv run ruff check .

      - name: Type check
        run: python -m uv run mypy

      - name: Check migrations
        run: python -m uv run python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python -m uv run python manage.py migrate --noinput

      - name: Test
        run: python -m uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: test-only-not-for-production
      DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://ameen:ameen@localhost:5432/ameen_retail
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ameen
          POSTGRES_PASSWORD: ameen
          POSTGRES_DB: ameen_retail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ameen -d ameen_retail"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --disable-pip-version-check "uv==0.13.0"
          python -m uv sync --frozen --extra dev

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        working-directory: frontend
        run: npm run e2e
