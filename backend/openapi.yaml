openapi: 3.0.3
info:
  title: Ameen Retail API
  version: 0.1.0
  description: >
    Phase 1 foundation only. Business resources from Document 05 are not
    implemented yet. The health path is operational; the pack requires health
    checks and does not name a URL.
servers:
  - url: http://localhost:8000
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Report whether the API and database are reachable
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Database accepted a trivial query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSuccess"
        "503":
          description: Database is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
    TenantHint:
      name: X-Tenant-Id
      in: header
      required: false
      description: Hint only. It does not select a tenant.
      schema:
        type: string
        format: uuid
  schemas:
    HealthSuccess:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [status, database]
          properties:
            status:
              type: string
              enum: [ok]
            database:
              type: string
              enum: [ok]
        meta:
          type: object
    ErrorEnvelope:
      type: object
      required: [success, data, meta, errors]
      properties:
        success:
          type: boolean
          enum: [false]
        data:
          nullable: true
        meta:
          type: object
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ApiError"
    ApiError:
      type: object
      required: [code, message, field]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        field:
          type: string
          nullable: true
    ErrorCode:
      type: string
      enum:
        - AUTH_REQUIRED
        - AUTH_INVALID_TOKEN
        - AUTH_TOKEN_EXPIRED
        - PERMISSION_DENIED
        - TENANT_ACCESS_DENIED
        - VALIDATION_ERROR
        - INVALID_FIELD
        - INVALID_FORMAT
        - INVALID_VALUE
        - METHOD_NOT_ALLOWED
        - RESOURCE_NOT_FOUND
        - RESOURCE_ALREADY_EXISTS
        - RESOURCE_CONFLICT
        - INSUFFICIENT_STOCK
        - INVALID_STATUS_TRANSITION
        - SALE_ALREADY_COMPLETED
        - SALE_ALREADY_VOIDED
        - PAYMENT_EXCEEDS_BALANCE
        - PRODUCT_SKU_EXISTS
        - REGISTER_NOT_OPEN
        - ACCOUNTING_ENTRY_UNBALANCED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
