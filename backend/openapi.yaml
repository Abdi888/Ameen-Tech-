openapi: 3.0.3
info:
  title: Ameen Retail API
  version: 0.1.0
  description: >
    Identity and access foundation. Health, cookie sessions, tenant membership,
    and Document 07 permission checks are implemented. Catalog, inventory,
    sales, and POS are not. The health path is operational; the pack requires
    health checks and does not name a URL.
servers:
  - url: http://localhost:8000
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Report whether the API and database are reachable
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Database accepted a trivial query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSuccess"
        "503":
          description: Database is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Create an HttpOnly session cookie
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/TenantHint"
      responses:
        "200":
          description: Session cookie set. The token is not in the body.
        "401":
          description: Unknown email or wrong password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: CSRF failure or tenant membership denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Temporary login lock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      responses:
        "200":
          description: Session revoked
        "401":
          description: Authentication required or session invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/auth/me:
    get:
      operationId: currentUser
      summary: Current user, memberships, tenant, roles, and permissions
      parameters:
        - $ref: "#/components/parameters/TenantHint"
      responses:
        "200":
          description: Authenticated profile
        "401":
          description: Authentication required, invalid, or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/users:
    get:
      operationId: listUsers
      summary: List members of the current tenant
      responses:
        "200":
          description: Tenant members
        "401":
          description: Authentication required
        "403":
          description: Permission denied or tenant membership denied
    post:
      operationId: inviteUser
      summary: Invite a member. The response does not contain a password.
      responses:
        "201":
          description: Membership created
        "403":
          description: Permission denied or protected role
        "409":
          description: Already a member
  /api/v1/roles:
    get:
      operationId: listRoles
      summary: List the eight system roles for a caller who can view users.
      responses:
        "200":
          description: System roles
        "403":
          description: Permission denied
components:
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
    TenantHint:
      name: X-Tenant-Id
      in: header
      required: false
      description: Hint only. The server accepts it after an active membership is proven.
      schema:
        type: string
        format: uuid
  schemas:
    HealthSuccess:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [status, database]
          properties:
            status:
              type: string
              enum: [ok]
            database:
              type: string
              enum: [ok]
        meta:
          type: object
    ErrorEnvelope:
      type: object
      required: [success, data, meta, errors]
      properties:
        success:
          type: boolean
          enum: [false]
        data:
          nullable: true
        meta:
          type: object
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ApiError"
    ApiError:
      type: object
      required: [code, message, field]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        field:
          type: string
          nullable: true
    ErrorCode:
      type: string
      enum:
        - AUTH_REQUIRED
        - AUTH_INVALID_TOKEN
        - AUTH_TOKEN_EXPIRED
        - PERMISSION_DENIED
        - TENANT_ACCESS_DENIED
        - VALIDATION_ERROR
        - INVALID_FIELD
        - INVALID_FORMAT
        - INVALID_VALUE
        - METHOD_NOT_ALLOWED
        - RESOURCE_NOT_FOUND
        - RESOURCE_ALREADY_EXISTS
        - RESOURCE_CONFLICT
        - INSUFFICIENT_STOCK
        - INVALID_STATUS_TRANSITION
        - SALE_ALREADY_COMPLETED
        - SALE_ALREADY_VOIDED
        - PAYMENT_EXCEEDS_BALANCE
        - PRODUCT_SKU_EXISTS
        - REGISTER_NOT_OPEN
        - ACCOUNTING_ENTRY_UNBALANCED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
